<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Results</title>
    <link rel="stylesheet" href="/src/results.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Session Results</h1>
            <div id="session-info" class="session-info">
                Loading session data...
            </div>
            <div class="search-controls">
                <input type="text" id="search-input" placeholder="Search text, gaze..." class="search-input">
                <select id="task-filter" class="emotion-filter">
                    <option value="">All Tasks</option>
                    <!-- Populated dynamically -->
                </select>
                <select id="item-filter" class="emotion-filter">
                    <option value="">All Items</option>
                    <!-- Populated dynamically -->
                </select>
                <select id="emotion-filter" class="emotion-filter">
                    <option value="">All Emotions</option>
                    <!-- Populated dynamically -->
                </select>
            </div>
            <a href="/" class="btn-back">Exit</a>
        </header>

        <main>
            <div id="timeline-container" class="timeline-container">
                <!-- Timeline items will be injected here -->
            </div>
        </main>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <img id="lightbox-img" class="lightbox-content" src="" alt="Enlarged view">
        <div id="lightbox-label" class="lightbox-label"></div>
    </div>

    <div id="viewer-modal" class="hidden"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: #000;">
        <div id="viewer-container" style="width: 100%; height: 100%;"></div>
        <button id="close-viewer" class="btn-primary"
            style="position: absolute; top: 20px; left: 20px; z-index: 1001; padding: 0.5rem 1rem; background: rgba(0,0,0,0.5); color: white; border: 1px solid white; border-radius: 4px; cursor: pointer;">Close
            3D View</button>
        <div id="viewer-info"
            style="position: absolute; bottom: 20px; left: 20px; z-index: 1001; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;">
            <div>Session ID: <span id="modal-session-id"></span></div>
            <div>Collected Items: <span id="modal-collected-count"></span></div>
            <div style="font-size: 0.8em; color: #aaa; margin-top: 5px;">WASD to move, Drag to look</div>
        </div>
    </div>
    <script type="module" src="/src/results.js"></script>
</body>

</html>
